<!doctype html>
<html lang="en" style="background-size: cover" id="main">
    <head>
        <title>Copperfield</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script
            src="https://js.sentry-cdn.com/59257458a9ad2ce92828474ecf1f2a9d.min.js"
            crossorigin="anonymous"
        ></script>
        <link href="bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
        <script>
            let auth0Client = null
            const fetchAuthConfig = () => fetch('/auth_config.json')
            const configureClient = async () => {
                const response = await fetchAuthConfig()
                const config = await response.json()
                //await new Promise((r) => setTimeout(r, 10000))
                auth0Client = new auth0.Auth0Client({
                    domain: config.domain,
                    clientId: config.clientId,
                })
            }
            const logout = () => {
                auth0Client.logout({
                    logoutParams: {
                        returnTo: window.location.origin + '/gm.html',
                    },
                })
            }

            window.onload = async () => {
                await configureClient()
                const isAuthenticated = await auth0Client.isAuthenticated()
                if (!isAuthenticated) {
                    const query = window.location.search
                    if (query.includes('code=') && query.includes('state=')) {
                        await auth0Client.handleRedirectCallback()
                        window.history.replaceState(
                            {},
                            document.title,
                            '/gm.html'
                        )
                        const user = await auth0Client.getUser()
                        document.getElementById('user').innerHTML = user.name
                        document.getElementById('games').value =
                            localStorage.getItem('game') || 0
                    } else {
                        await auth0Client.loginWithRedirect({
                            authorizationParams: {
                                redirect_uri:
                                    window.location.origin + '/gm.html',
                            },
                        })
                    }
                } else {
                    const user = await auth0Client.getUser()
                    document.getElementById('user').innerHTML = user.name
                    document.getElementById('games').value =
                        localStorage.getItem('game') || 0
                }
            }
        </script>
        <style>
            .progress {
                height: 45px;
                font-size: 36px;
            }

            .row > * {
                padding: 0;
            }

            #user {
                color: white;
            }
            .action {
                cursor: pointer;
            }
            .cluelabel {
                text-align: center;
            }
            span[disabled] {
                pointer-events: none;
            }
            /* Checklist "behind pace" warnings: orange (>5 min), red (>10 min). */
            tr.behind-warning > td {
                background-color: orange !important;
            }
            tr.behind-danger > td {
                background-color: red !important;
                color: white;
            }
        </style>
    </head>

    <body>
        <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
            <div class="container-fluid">
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto mb-2 mb-md-0">
                        <li class="nav-item dropdown">
                            <select id="games"></select>
                        </li>
                    </ul>
                    <span id="user"></span>
                </div>
            </div>
        </nav>

        <main class="container" style="padding-top: 75px">
            <div class="row" id="p0" style="display: none">
                <div class="col" id="plabel0"></div>
                <div class="progress col-10">
                    <div
                        id="progress"
                        class="progress-bar progress-bar-striped progress-bar-animated"
                        role="progressbar"
                        style="width: 0%"
                        aria-valuenow="0"
                        aria-valuemin="0"
                        aria-valuemax="3600"
                    ></div>
                </div>
                <div class="col">
                    <span class="action" id="intro"
                        ><ion-icon
                            name="play-outline"
                            aria-label="Start Game"
                            style="color: green; font-weight: bold"
                        ></ion-icon
                    ></span>
                    <span class="action" id="finish">
                        <ion-icon
                            name="stop-outline"
                            aria-label="Stop Game"
                            style="color: red; font-weight: bold"
                        ></ion-icon>
                    </span>
                    <span class="action" id="reset">
                        <ion-icon
                            name="refresh-outline"
                            aria-label="Reset Game"
                            style="color: blue; font-weight: bold"
                        ></ion-icon> </span
                    ><br />
                    <span class="action" id="addtime">
                        <ion-icon
                            name="add-outline"
                            aria-label="Add Time"
                            style="color: orange; font-weight: bold"
                        ></ion-icon>
                    </span>
                    <span class="action" id="removetime">
                        <ion-icon
                            name="remove-outline"
                            aria-label="Remove Time"
                            style="color: orange; font-weight: bold"
                        ></ion-icon>
                    </span>
                </div>
            </div>
            <div class="row">
                <div class="col"></div>
                <div
                    class="row col-10"
                    id="timeline"
                    style="padding-bottom: 25px"
                ></div>
                <div class="col"></div>
            </div>
            <div class="row">
                <div class="col col-6">
                    <select class="form-select" id="shortclues"></select>
                    <br />
                    <select class="form-select" id="audioclues"></select>
                </div>
                <div class="col col-6">
                    <div class="form-floating">
                        <textarea
                            class="form-control"
                            placeholder="Clue..."
                            id="cluebox"
                            style="height: 100px"
                        ></textarea>
                        <label for="cluebox">Clue...</label>
                    </div>
                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="cluesubmit"
                    >
                        Send
                    </button>
                    <button
                        type="submit"
                        class="btn btn-secondary"
                        id="clueclear"
                    >
                        Clear
                    </button>
                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="audiocluesubmit"
                    >
                        Send Audio
                    </button>
                </div>
                
            </div>
            <div class="row">
                <div class="col col-6" id="log"></div>
                <div class="col col-6" id="checklist"></div>
        </div>
        </main>

        <script src="jquery-3.7.1.slim.min.js"></script>
        <script src="bootstrap.bundle.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script>
            var game = 0
            const socket = io({
                transports: ['websocket'],
            })
            // Format a time in seconds as M:SS (zero-padded seconds), or a
            // placeholder (default '(TBD)') when there's no value.
            function formatTime(seconds, placeholder) {
                if (seconds == null || isNaN(seconds)) {
                    return placeholder == null ? '(TBD)' : placeholder
                }
                var total = Math.round(seconds)
                var mins = Math.floor(total / 60)
                var secs = total % 60
                return mins + ':' + String(secs).padStart(2, '0')
            }
            var games = [
                {
                    nodes: 0,
                    instances: [
                        {
                            id: 0,
                            name: 'Loading...',
                        },
                    ],
                },
            ]

            socket.on('connect', function () {
                socket.emit('gm', (data) => {
                    $('#games').empty()
                    $.each(data.games, function (i, game) {
                        $('#games').append(
                            '<option value="' +
                                game.id +
                                '">' +
                                game.name +
                                '</option>'
                        )
                    })
                    games = data.games
                    document.getElementById('games').value =
                        localStorage.getItem('game') || 0
                    setGame()
                })
            })

            socket.on('status', (data) => {
                game = $('#games option:selected').val()
                for (var i = 0; i < games[game].nodes; i++) {
                    if (games[game].instances[i].id == data.instance) {
                        currentState = data.state
                        $('#plabel' + i).text(
                            games[game].instances[i].name +
                                ' (' +
                                data.state +
                                ')'
                        )
                        $('#progress').html(data.time)
                        var pc = (3600 - data.secondsLeft) / 36
                        $('#progress').css('width', pc + '%')
                        if (data.secondsLeft < 120) {
                            $('#progress').css('background-color', 'red')
                        } else if (data.secondsLeft < 300) {
                            $('#progress').css('background-color', 'orange')
                        } else {
                            $('#progress').css('background-color', 'green')
                        }
                        $('#log').html(data.log)
                        // states = reset, intro, running, fail, win, post, running
                        //Enable the Start button
                        if (data.state == 'reset') {
                            $('#intro').attr('disabled', false)
                            $('#reset').attr('disabled', true)
                            $('#finish').attr('disabled', true)
                        }
                        //Enable the Stop button
                        if (data.state == 'running') {
                            $('#intro').attr('disabled', true)
                            $('#reset').attr('disabled', true)
                            $('#finish').attr('disabled', false)
                        }
                        //Enable the Reset button
                        if (data.state == 'post') {
                            $('#intro').attr('disabled', true)
                            $('#reset').attr('disabled', false)
                            $('#finish').attr('disabled', true)
                        }
                        var tickState = data.tick_items || {}
                        var shownState = data.shown_items || {}
                        var tickTimes = data.tick_times || {}
                        var averages = games[game].tickAverages || {}
                        // Complete checkboxes are only interactive while the
                        // game is running; otherwise they are disabled.
                        var tickEnabled = data.state == 'running'
                        $('#checklist .complete-cb').each(function () {
                            var label = $(this).data('label')
                            $(this).prop('checked', !!tickState[label])
                            $(this).prop('disabled', !tickEnabled)
                        })
                        $('#checklist .shown-cb').each(function () {
                            var label = $(this).data('label')
                            $(this).prop('checked', !!shownState[label])
                        })
                        // "This team": time remaining when this item was last
                        // ticked in the current game (blank until ticked).
                        $('#checklist .team-time').each(function () {
                            var label = $(this).data('label')
                            var t = tickTimes[label]
                            $(this).text(t == null ? '' : formatTime(t))
                        })
                        // Row colouring: warn when the team is behind the
                        // average pace for an item they haven't ticked yet.
                        // Times are time remaining, so being "later" than the
                        // average means less time left (avg - now is positive).
                        $('#checklist tbody tr').each(function () {
                                var row = $(this)
                                var label = row.attr('data-label')
                                if (label == null) return
                                row.removeClass('behind-warning behind-danger')
                                var avg = averages[label]
                                if (
                                    data.state != 'running' ||
                                    tickState[label] ||
                                    avg == null ||
                                    isNaN(avg)
                                ) {
                                    return
                                }
                                var deficit = avg - data.secondsLeft
                                if (deficit > 600) {
                                    row.addClass('behind-danger')
                                } else if (deficit > 300) {
                                    row.addClass('behind-warning')
                                }
                        })
                    }
                }
            })

            $('.action').click(function () {
                var action = $(this).attr('id')
                socket.emit('action', {
                    instance: game, //FIXME - needs to be per-instance, not per game.
                    action: action,
                    gm: document.getElementById('user').innerHTML,
                })
                if (action == 'finish') {
                    setTimeout(logout, 120000) // 2 mins
                }
            })

            $('#shortclues').change(function () {
                $('#cluebox').val($('#shortclues option:selected').text())
            })

            $('#cluesubmit').click(function () {
                socket.emit('clue', {
                    instance: game,
                    clue: $('#cluebox').val().replaceAll('\n', '<br>'),
                    gm: document.getElementById('user').innerHTML,
                })
            })

            $('#audiocluesubmit').click(function () {
                socket.emit('audioclue', {
                    instance: game,
                    audioclue: $('#audioclues option:selected').val(),
                    gm: document.getElementById('user').innerHTML,
                })
            })

            $('#clueclear').click(function () {
                $('#cluebox').val('')
                socket.emit('clue', {
                    instance: game,
                    clue: '',
                    gm: document.getElementById('user').innerHTML,
                })
            })

            $('#user').click(logout)

            function setGame() {
                $('#p0').css('display', 'none')
                //$('#p1').css('display', 'none')
                game = $('#games option:selected').val() || 0
                for (var i = 0; i < games[game].nodes; i++) {
                    $('#plabel' + i).text(games[game].instances[i].name)
                    $('#p' + i).css('display', 'flex')
                }

                $('#timeline').empty()
                $.each(games[game].timeline, function (i, t) {
                    $('#timeline').append(
                        `<div class="col cluelabel">${t}</div>`
                    )
                })

                $('#shortclues').empty()
                $('#shortclues').append(
                    '<option selected disabled>Quick clues</option>'
                )
                $.each(games[game].clues, function (cluegrougroup, clue) {
                    $('#shortclues').append(
                        `<optgroup label="${cluegrougroup}">`
                    )
                    $.each(clue, function (i, c) {
                        $('#shortclues').append(
                            `<option value="${i}">${c}</option>`
                        )
                    })
                    $('#shortclues').append('</optgroup>')
                })

                $('#audioclues').empty()
                $('#audioclues').append(
                    '<option selected disabled>Audio clues</option>'
                )
                $.each(games[game].audioclues, function (cluegrougroup, clue) { 
                    $('#audioclues').append(
                        `<optgroup label="${cluegrougroup}">`
                    )
                    $.each(clue, function (i, c) {
                        Object.entries(c).forEach(([key, value]) => {
                            $('#audioclues').append(
                                `<option value="${key}">${value}</option>`
                            )
                        })
                    })
                    $('#audioclues').append('</optgroup>')
                })

                $('#main').css(
                    'background',
                    `url("${games[game].gmBackground}") no-repeat center center fixed`
                )
                $('#checklist').empty()
                // The GM sees every item. Two independent checkboxes per row:
                //  - "Shown"    -> room-screen visibility (emits 'showitem')
                //  - "Complete" -> completion/strikethrough (emits 'tickitem')
                // Both are synced from the status broadcast.
                var table = $(
                    '<table class="table table-sm">' +
                        '<thead><tr>' +
                        '<th>Shown</th><th>Complete</th><th>Description (Avg team time)</th><th>This team</th>' +
                        '</tr></thead><tbody></tbody></table>'
                )
                var tbody = table.find('tbody')
                var tickAverages = games[game].tickAverages || {}
                // Average recorded time (seconds remaining) formatted as
                // (M:SS) or (TBD) when there's no recorded data.
                function formatAvg(seconds) {
                    return '(' + formatTime(seconds, 'TBD') + ')'
                }
                // Sort by average team time descending (largest average time
                // remaining first), items with no recorded data (TBD) last,
                // keeping their original order among themselves.
                var labels = Object.keys(games[game].tickItems)
                labels.sort(function (a, b) {
                    var av = tickAverages[a]
                    var bv = tickAverages[b]
                    var aHas = av != null && !isNaN(av)
                    var bHas = bv != null && !isNaN(bv)
                    if (aHas && bHas) {
                        return bv - av // descending average time remaining
                    }
                    if (aHas) return -1 // a has data, b is TBD -> a first
                    if (bHas) return 1  // b has data, a is TBD -> b first
                    return 0            // both TBD -> keep original order (stable)
                })
                $.each(labels, function (idx, label) {
                    var row = $('<tr/>').attr('data-label', label)
                    var shownCb = $(
                        '<input type="checkbox" class="shown-cb" disabled>'
                    ).attr('data-label', label)
                    var completeCb = $(
                        '<input type="checkbox" class="complete-cb" disabled>'
                    ).attr('data-label', label)
                    shownCb.click(function () {
                        socket.emit('showitem', {
                            instance: game,
                            item: label,
                            value: $(this).is(':checked'),
                            gm: document.getElementById('user').innerHTML,
                        })
                    })
                    completeCb.click(function () {
                        socket.emit('tickitem', {
                            instance: game,
                            item: label,
                            value: $(this).is(':checked'),
                            gm: document.getElementById('user').innerHTML,
                        })
                    })
                    row.append($('<td/>').append(shownCb))
                    row.append($('<td/>').append(completeCb))
                    row.append(
                        $('<td/>').text(label + ' ' + formatAvg(tickAverages[label]))
                    )
                    // "This team" cell, filled live from the status broadcast.
                    row.append(
                        $('<td class="team-time"/>').attr('data-label', label)
                    )
                    tbody.append(row)
                })
                $('#checklist').append(table)
                // Safety: the "Shown" checkboxes are disabled by default so
                // visibility can't be changed accidentally. This toggle
                // enables/disables them.
                var changeShown = $(
                    '<input type="checkbox" id="change-shown">'
                )
                var changeShownLabel = $(
                    '<label for="change-shown"> Change shown</label>'
                )
                changeShown.change(function () {
                    var enabled = $(this).is(':checked')
                    $('#checklist .shown-cb').prop('disabled', !enabled)
                })
                $('#checklist').append(
                    $('<div class="mt-2"/>').append(changeShown, changeShownLabel)
                )
                localStorage.setItem('game', game)
            }

            $('#games').change(setGame)
        </script>
        <script
            type="module"
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
        ></script>
        <script
            nomodule
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
        ></script>
    </body>
</html>
