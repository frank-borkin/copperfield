<!doctype html>
<html lang="en" style="background-size: cover" id="main">
    <head>
        <title>Copperfield Manager</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="bootstrap.min.css" rel="stylesheet" />

        <style>
            .progress {
                height: 45px;
                font-size: 36px;
            }

            .row {
                padding-bottom: 10px;
            }

            .row > * {
                padding: 0;
            }

            #user {
                color: white;
            }
            .action {
                cursor: pointer;
            }
            .cluelabel {
                text-align: center;
            }
            span[disabled] {
                pointer-events: none;
            }
            #main {
                margin: 50px;
            }
            /* Tick-item dots sit in a track directly below each progress bar.
               Positioned as a percentage across the same width the bar uses. */
            .tick-track {
                position: relative;
                height: 16px;
                margin-top: 4px;
            }
            .tick-dot {
                position: absolute;
                top: 0;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                transform: translateX(-50%);
                border: 1px solid rgba(0, 0, 0, 0.35);
            }
            .tick-dot.green {
                background-color: #28a745;
            }
            .tick-dot.orange {
                background-color: #fd7e14;
            }
            .tick-dot.red {
                background-color: #dc3545;
            }
            .tick-dot.grey {
                background-color: #adb5bd;
            }
        </style>
    </head>

    <body>
        <main class="container" id="main"></main>

        <script src="jquery-3.7.1.slim.min.js"></script>
        <script src="bootstrap.bundle.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script>
            var game = 0
            const socket = io({
                transports: ['websocket'],
            })
            var games = [
                {
                    nodes: 0,
                    instances: [
                        {
                            id: 0,
                            name: 'Loading...',
                        },
                    ],
                },
            ]

            socket.on('connect', function () {
                socket.emit('gm', (data) => {
                    games = data.games
                    for (var game = 0; game < games.length; game++) {
                        $('main').append(
                            '<div class="row" id="p' +
                                game +
                                '" style="display: flex"><div class="col" id="plabel' +
                                game +
                                '"></div><div class="col-10" style="padding: 0"><div class="progress"><div id="progress' +
                                game +
                                '" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="3600"></div></div><div class="tick-track" id="ticks' +
                                game +
                                '"></div></div></div>'
                        )
                    }
                })
            })

            socket.on('status', (data) => {
                for (var game = 0; game < games.length; game++) {
                    if (data.instance == game) {
                        $('#plabel' + game).text(
                            games[game].name + ' (' + data.state + ')'
                        )
                        $('#progress' + game).html(data.time)
                        var pc = (3600 - data.secondsLeft) / 36
                        $('#progress' + game).css('width', pc + '%')
                        if (data.secondsLeft < 120) {
                            $('#progress' + game).css('background-color', 'red')
                        } else if (data.secondsLeft < 300) {
                            $('#progress' + game).css(
                                'background-color',
                                'orange'
                            )
                        } else {
                            $('#progress' + game).css(
                                'background-color',
                                'green'
                            )
                        }
                        renderTicks(game, data)
                    }
                }
            })

            // Position (percent across the bar) for a given "seconds remaining"
            // value, matching the progress-bar width formula: full room = 3600s.
            function seconds_to_percent(seconds) {
                var pc = (3600 - seconds) / 36
                if (pc < 0) pc = 0
                if (pc > 100) pc = 100
                return pc
            }

            // Draw a dot per tick item below the progress bar:
            //  - ticked: placed at the time it was ticked, coloured by how late
            //    it was vs the item's average (times are seconds remaining, so
            //    "late" means fewer seconds left than the average).
            //      green  = within 5 min of average
            //      orange = more than 5 min late
            //      red    = more than 10 min late
            //  - unticked with an average: grey dot at the average position
            //  - unticked without an average: no dot
            function renderTicks(game, data) {
                var track = $('#ticks' + game)
                track.empty()
                var tickState = data.tick_items || {}
                var tickTimes = data.tick_times || {}
                var averages = games[game].tickAverages || {}
                var labels = Object.keys(games[game].tickItems || {})
                $.each(labels, function (idx, label) {
                    var avg = averages[label]
                    var hasAvg = avg != null && !isNaN(avg)
                    var ticked = !!tickState[label]
                    var pos, cls
                    if (ticked) {
                        var t = tickTimes[label]
                        if (t == null || isNaN(t)) return
                        pos = seconds_to_percent(t)
                        if (hasAvg) {
                            // late = seconds remaining below the average
                            var late = avg - t
                            if (late > 600) {
                                cls = 'red'
                            } else if (late > 300) {
                                cls = 'orange'
                            } else {
                                cls = 'green'
                            }
                        } else {
                            // No average to compare against: treat as on time.
                            cls = 'green'
                        }
                    } else {
                        if (!hasAvg) return
                        pos = seconds_to_percent(avg)
                        cls = 'grey'
                    }
                    $('<div/>')
                        .addClass('tick-dot ' + cls)
                        .attr('title', label)
                        .css('left', pos + '%')
                        .appendTo(track)
                })
            }
        </script>
        <script
            type="module"
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
        ></script>
        <script
            nomodule
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
        ></script>
    </body>
</html>
